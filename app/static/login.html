<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in — Prompt Optimisation Demo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    .login-wrap { min-height: calc(100vh - 160px); display: flex; align-items: center; justify-content: center; }
    .login-card { width: 100%; max-width: 400px; }
    .login-card input[type="password"] {
      width: 100%; padding: 10px 12px; font: inherit;
      border: 1px solid var(--ec-grey-border); border-radius: var(--radius);
    }
    .login-card input[type="password"]:focus { outline: 2px solid var(--ec-blue); }
    .login-error { color: var(--ec-red); font-size: 13.5px; min-height: 20px; margin: 8px 0 0; }
    .login-card .btn { width: 100%; margin-top: 14px; }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container site-header__inner">
      <a class="site-header__brand" href="/login.html">
        <svg class="emblem" viewBox="0 0 60 40" role="img" aria-label="European emblem">
          <rect width="60" height="40" fill="#003399"/>
          <g fill="#FFCC00" transform="translate(30,20)">
            <g id="s"><polygon points="0,-4 0.94,-1.29 3.8,-1.24 1.52,0.49 2.35,3.24 0,1.6 -2.35,3.24 -1.52,0.49 -3.8,-1.24 -0.94,-1.29" transform="translate(0,-12)"/></g>
            <use href="#s" transform="rotate(30)"/><use href="#s" transform="rotate(60)"/>
            <use href="#s" transform="rotate(90)"/><use href="#s" transform="rotate(120)"/>
            <use href="#s" transform="rotate(150)"/><use href="#s" transform="rotate(180)"/>
            <use href="#s" transform="rotate(210)"/><use href="#s" transform="rotate(240)"/>
            <use href="#s" transform="rotate(270)"/><use href="#s" transform="rotate(300)"/>
            <use href="#s" transform="rotate(330)"/>
          </g>
        </svg>
        <span class="site-header__wordmark">
          <span class="site-header__institution">European Commission</span>
          <span class="site-header__site">Prompt Optimisation Demo</span>
        </span>
      </a>
    </div>
  </header>

  <main class="login-wrap">
    <section class="card login-card" aria-labelledby="login-title">
      <h2 class="card__title" id="login-title">Restricted demo</h2>
      <p style="font-size:14px; color:var(--ec-text-muted); margin-top:0;">
        Enter the access password to use the assistant.
      </p>
      <form id="login-form">
        <label class="field__label" for="password">Password</label>
        <input type="password" id="password" autocomplete="current-password" autofocus />
        <p class="login-error" id="login-error"></p>
        <button class="btn btn--primary" type="submit">Sign in</button>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p><strong>Prompt Optimisation Demo</strong> — internal demonstrator, not an official European Commission service.</p>
    </div>
  </footer>

  <script>
    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const errorEl = document.getElementById("login-error");
      errorEl.textContent = "";
      try {
        const res = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ password: document.getElementById("password").value }),
        });
        if (!res.ok) {
          const body = await res.json().catch(() => ({}));
          throw new Error(body.detail || "Sign-in failed");
        }
        window.location.href = "/";
      } catch (err) {
        errorEl.textContent = err.message;
      }
    });
  </script>
</body>
</html>
